[project]
name = "autosafety"
version = "0.1.0"
description = "AutoSafety GraphQL Copilot - hybrid GraphRAG and Text-to-SQL analyst for vehicle safety data"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "structlog>=24.0.0",
    "neo4j>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    # tests/test_phase11_quality_gates.py parses .github/workflows/ci.yml.
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    # Pre-commit hooks; see .pre-commit-config.yaml.
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
# First-party code only. `migrations/versions/` is linted too (see per-file-ignores
# below) but is never reformatted: applied revisions are historical records.
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

# `make lint` is the enforced gate and must stay green.
#
# E501 is enforced. Phase 10 and Phase 11 both left it advisory; the Phase 11
# completion pass adopted `ruff format` and hand-wrapped the residue, so the
# only remaining exemptions are the four files listed below, each of which
# embeds a query or prompt DSL where a line break changes what is transmitted.
#
# Correctness (F), import hygiene (I), naming (N), modernization (UP), and line
# length (E501) are all enforced. Only N806 and UP042 are excluded globally,
# each for a stated reason.
ignore = [
    # N806 fires on `Session = sessionmaker(...)` / `SessionLocal = sessionmaker(...)`.
    # These bind a *class*, and PascalCase is SQLAlchemy's own documented convention;
    # renaming them to satisfy a variable-naming rule would make the code less
    # conventional, not more. All 17 occurrences are this pattern.
    "N806",
    # UP042 wants `class X(str, Enum)` rewritten as `StrEnum`. The two are not
    # interchangeable: `StrEnum` changes what `str()` and f-string formatting
    # produce for a member, and these enums are serialized into tool names,
    # template ids, and source types on the guarded answer path. Deferred as a
    # behavior change, not adopted as a style fix.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Alembic revisions are immutable history. Their unused-import and import-order
# findings come from the `script.py.mako` template, not from hand-written code,
# and rewriting an applied revision to satisfy a style rule risks the one thing
# Phase 9 fixed: a chain a fresh clone can replay. Correctness rules (F8xx, E7xx)
# stay active here.
"migrations/versions/*.py" = ["F401", "I001", "UP007", "UP035", "E501"]
# `env.py` imports every model so that Alembic autogenerate can see them on
# `Base.metadata`. Those imports are load-bearing precisely because nothing
# references them, and the `sys.path` bootstrap must run before them.
"migrations/env.py" = ["F401", "E402", "I001"]
# Star-imports every model so `Base.metadata.create_all()` sees all tables; the
# names then read as "possibly undefined" (F405) at each use site.
"tests/test_phase2_sql_analytics.py" = ["F405"]

# The remaining E501 exemptions. Each of these files embeds a DSL as a string
# constant, where a newline is not cosmetic:
#
#   *_queries / graph_expander -- Cypher sent to Neo4j. These are the fixed,
#   allowlisted queries Phase 3-7 depend on; reflowing a MATCH pattern edits the
#   text of a security-relevant query to satisfy a style rule.
#
#   prompt_builder / providers -- literal prompt text sent to the model. A line
#   break changes the model's input, which is a behavior change, not formatting.
#
# Every other line-length finding in the repository is fixed, not exempted.
"app/services/graph/graph_queries.py" = ["E501"]
"app/services/graphrag/graph_expander.py" = ["E501"]
"app/services/answer_synthesis/prompt_builder.py" = ["E501"]
"app/services/answer_synthesis/providers.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
# Not `strict = true`: that turns on disallow_any_generics and
# disallow_untyped_calls, which would demand annotating third-party generics
# and every SQLAlchemy/FastAPI boundary. Each flag below was measured against
# the codebase and enabled deliberately.
strict = false

# The core of the Phase 11 completion policy: a production function can no
# longer escape type checking by being unannotated.
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Already clean when enabled; they stay clean.
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

# Returning Any from a typed function silently erases the annotation.
warn_return_any = true

# `scripts/` and `tests/` are first-party and type-checked, but they are not the
# production package: a fixture or a CLI helper may stay unannotated where an
# annotation would add noise rather than safety. Every other flag above still
# applies to them.
[[tool.mypy.overrides]]
module = ["scripts.*", "tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
